version: '3.9'

# Production Docker Compose Configuration
# ICU Blockchain Payment System
# SSL/TLS enabled with nginx reverse proxy
# 
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
# - .env.prod file with production secrets
# - SSL certificates in ./certs/ directory
#   - certs/cert.pem (certificate)
#   - certs/privkey.pem (private key)

services:
  # PostgreSQL Database (managed separately in production)
  postgres:
    image: postgres:16-alpine
    container_name: icu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-icu_payments}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements -c log_statement=all -c log_min_duration_statement=1000"
    ports:
      - "127.0.0.1:5430:5432"  # Only accessible locally
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/backups:/backups
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - icu-payment-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: icu-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible locally
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - icu-payment-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Backend API (Node.js)
  backend:
    image: ${REGISTRY:-docker.io}/${DOCKER_NAMESPACE:-myusername}/icu-backend:${VERSION:-latest}
    container_name: icu-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-icu_payments}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      FRONTEND_URL: ${FRONTEND_URL:-https://yourdomain.com}
      PYTHON_SERVICE_URL: http://python-service:8000
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - icu-payment-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Python Matching Service
  python-service:
    image: ${REGISTRY:-docker.io}/${DOCKER_NAMESPACE:-myusername}/icu-python-service:${VERSION:-latest}
    container_name: icu-python-service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-icu_payments}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHON_SERVICE_PORT: 8000
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - icu-payment-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend with nginx (SSL/TLS enabled)
  frontend:
    image: ${REGISTRY:-docker.io}/${DOCKER_NAMESPACE:-myusername}/icu-frontend:${VERSION:-latest}
    container_name: icu-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates (mount as read-only)
      - ./certs:/etc/nginx/certs:ro
      # Production nginx configuration
      - ./frontend/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt validation directory
      - ./certbot-data:/var/www/certbot:ro
      # nginx logs
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - icu-payment-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  icu-payment-network:
    driver: bridge
    name: icu-payment-network
