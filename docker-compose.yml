# ICU Blockchain Payment System - Docker Compose
# Core stack: docker-compose up
# With blockchain: docker-compose --profile blockchain up
# Requires: .env with DB_PASSWORD, JWT_SECRET, FRONTEND_URL

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: icu-postgres
    restart: always
    environment:
      POSTGRES_DB: icu_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: icu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icu-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: icu_payments
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PYTHON_SERVICE_URL: http://python-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python Matching Service (Flask)
  python-service:
    build:
      context: ./backend/python-services
      dockerfile: Dockerfile
    container_name: icu-python-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: icu_payments
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PYTHON_SERVICE_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React/Vite) - Production build with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: icu-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== Blockchain (optional - use --profile blockchain) ==========
  # Requires: ./blockchain/crypto-config and ./blockchain/channel-artifacts
  # Generate with: cryptogen generate --config=./crypto-config.yaml

  ca.icu.edu.zm:
    profiles:
      - blockchain
    image: hyperledger/fabric-ca:2.5
    container_name: ca.icu.edu.zm
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.icu.edu.zm
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./blockchain/crypto-config/peerOrganizations/icu.edu.zm/ca/:/etc/hyperledger/fabric-ca-server-config

  couchdb:
    profiles:
      - blockchain
    image: couchdb:3.3
    container_name: couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data

  peer0.icu.edu.zm:
    profiles:
      - blockchain
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.icu.edu.zm
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_PEER_ID=peer0.icu.edu.zm
      - CORE_PEER_ADDRESS=peer0.icu.edu.zm:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.icu.edu.zm:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.icu.edu.zm:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.icu.edu.zm:7051
      - CORE_PEER_LOCALMSPID=ICUMSP
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - "7051:7051"
    volumes:
      - /var/run/:/host/var/run/
      - ./blockchain/crypto-config/peerOrganizations/icu.edu.zm/peers/peer0.icu.edu.zm/msp:/etc/hyperledger/fabric/msp
      - ./blockchain/crypto-config/peerOrganizations/icu.edu.zm/peers/peer0.icu.edu.zm/tls:/etc/hyperledger/fabric/tls
      - peer0.icu.edu.zm:/var/hyperledger/production
    depends_on:
      - couchdb

  orderer.icu.edu.zm:
    profiles:
      - blockchain
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.icu.edu.zm
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - "7050:7050"
    volumes:
      - ./blockchain/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./blockchain/crypto-config/ordererOrganizations/icu.edu.zm/orderers/orderer.icu.edu.zm/msp:/var/hyperledger/orderer/msp
      - ./blockchain/crypto-config/ordererOrganizations/icu.edu.zm/orderers/orderer.icu.edu.zm/tls:/var/hyperledger/orderer/tls
      - orderer.icu.edu.zm:/var/hyperledger/production/orderer

volumes:
  postgres-data:
  redis-data:
  couchdb-data:
  peer0.icu.edu.zm:
  orderer.icu.edu.zm:

networks:
  default:
    name: icu-payment-network
